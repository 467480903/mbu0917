<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据库测试 - 关节角</title>
<link rel="stylesheet" href="../../bootstrap.min.css">
<style>
body { padding: 20px; max-width: 960px; margin: 0 auto; }
.log { background:#f8f9fa; border:1px solid #dee2e6; border-radius:4px; padding:10px; height:220px; overflow-y:auto; font-family:monospace; font-size:13px; white-space:pre-wrap; }
pre#listArea { background:#f8f9fa; padding:10px; border-radius:4px; max-height:280px; overflow:auto; }
.dot { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:4px; }
.dot.on { background:#28a745; } .dot.off { background:#dc3545; }
</style>
</head>
<body>
<h3>数据库测试 - 关节角</h3>
<p class="text-muted mb-3">前置：先运行 <code>python3 test/services2/test_db_service.py</code><br>
连接状态：<span class="dot off" id="dot"></span><span id="mqttStatus">未连接</span></p>

<div class="card mb-3">
  <div class="card-header">增 / 改</div>
  <div class="card-body">
    <div class="row g-2">
      <div class="col-3"><label>类型</label>
        <select id="type" class="form-control"><option>head</option><option>waist</option><option>left_arm</option><option>right_arm</option><option>arms</option><option>whole</option></select>
      </div>
      <div class="col-3"><label>名称</label><input id="name" class="form-control" placeholder="p1"></div>
      <div class="col-6"><label>值 (JSON)</label><textarea id="value" class="form-control" rows="3">{"idx11_head_joint1":0.0,"idx12_head_joint2":0.0,"idx13_head_joint3":0.0}</textarea></div>
    </div>
    <div class="mt-2"><button class="btn btn-primary" onclick="doAdd()">增</button> <button class="btn btn-warning" onclick="doUpdate()">改</button></div>
  </div>
</div>

<div class="card mb-3">
  <div class="card-header">删 / 运动到位置 / 读取</div>
  <div class="card-body">
    <div class="row g-2">
      <div class="col-3"><label>类型</label>
        <select id="dtype" class="form-control"><option>head</option><option>waist</option><option>left_arm</option><option>right_arm</option><option>arms</option><option>whole</option></select>
      </div>
      <div class="col-3"><label>名称</label><input id="dname" class="form-control" placeholder="p1"></div>
      <div class="col-6 d-flex align-items-end">
        <button class="btn btn-danger me-2" onclick="doDelete()">删</button>
        <button class="btn btn-success me-2" onclick="doMove()">运动到位置</button>
        <button class="btn btn-info" onclick="doGet()">读取所有</button>
      </div>
    </div>
  </div>
</div>

<div class="card"><div class="card-header">数据列表（按名称排序）</div><div class="card-body"><pre id="listArea">（空）</pre></div></div>
<div class="card mt-3"><div class="card-header">MQTT 响应日志</div><div class="card-body"><div class="log" id="logArea"></div></div></div>

<script src="../../paho-mqtt.min.js"></script>
<script>
'use strict';

const BROKER = location.hostname || '10.2.236.6';
const PORT = 9001;
const REQUEST_TOPIC = '/humanoid/db/request/';
const RESPONSE_TOPIC = '/humanoid/db/response/';

let mqttClient = null;

// ---------- DOM 工具 ----------
function byId(id) {
    return document.getElementById(id);
}

function log(message) {
    const el = byId('logArea');
    el.textContent += '[' + new Date().toLocaleTimeString() + '] ' + message + '\n';
    el.scrollTop = el.scrollHeight;
}

function setConnectionStatus(connected) {
    byId('mqttStatus').textContent = connected ? '已连接' : '未连接';
    byId('dot').className = 'dot ' + (connected ? 'on' : 'off');
}

// ---------- MQTT ----------
function connect() {
    mqttClient = new Paho.Client(
        BROKER,
        PORT,
        'db_joints_' + Math.random().toString(16).substr(2, 8)
    );

    mqttClient.onConnectionLost = function (response) {
        if (response.errorCode !== 0) {
            setConnectionStatus(false);
            log('连接丢失: ' + response.errorMessage);
        }
    };

    mqttClient.onMessageArrived = function (message) {
        try {
            const data = JSON.parse(message.payloadString);
            log('响应: ' + message.payloadString);
            if (data.cmd === 'getJoints') {
                byId('listArea').textContent = JSON.stringify(data.result, null, 2);
            }
        } catch (error) {
            log('非法响应: ' + message.payloadString);
        }
    };

    mqttClient.connect({
        onSuccess: function () {
            setConnectionStatus(true);
            log('已连接 ' + BROKER + ':' + PORT);
            mqttClient.subscribe(RESPONSE_TOPIC, { qos: 2 });
        },
        onFailure: function (error) {
            setConnectionStatus(false);
            log('连接失败: ' + error.errorMessage);
        }
    });
}

function publish(payload) {
    if (!mqttClient || !mqttClient.isConnected()) {
        log('未连接，无法发送');
        return false;
    }
    const message = new Paho.Message(JSON.stringify(payload));
    message.destinationName = REQUEST_TOPIC;
    message.qos = 2;
    mqttClient.send(message);
    log('发送: ' + JSON.stringify(payload));
    return true;
}

// ---------- 表单解析 ----------
function readJointValue() {
    try {
        return JSON.parse(byId('value').value.trim());
    } catch (error) {
        alert('值必须是合法 JSON');
        return null;
    }
}

// ---------- 按钮操作 ----------
function doAdd() {
    const value = readJointValue();
    if (value === null) return;
    publish({
        cmd: 'addJoint',
        type: byId('type').value,
        name: byId('name').value.trim(),
        value: value
    });
}

function doUpdate() {
    const value = readJointValue();
    if (value === null) return;
    publish({
        cmd: 'updateJoint',
        type: byId('type').value,
        name: byId('name').value.trim(),
        value: value
    });
}

function doDelete() {
    const name = byId('dname').value.trim();
    if (!name) {
        alert('请输入名称');
        return;
    }
    publish({ cmd: 'deleteJoint', type: byId('dtype').value, name: name });
}

function doMove() {
    const name = byId('dname').value.trim();
    if (!name) {
        alert('请输入名称');
        return;
    }
    if (!confirm('确认运动到关节位置「' + name + '」？机器将运动！')) return;
    publish({ cmd: 'moveJoint', name: name });
}

function doGet() {
    publish({ cmd: 'getJoints' });
}

connect();
</script>
</body>
</html>
